<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>

            body {
                margin: 0;
                color: #fff;
            }

            .layout {
                display:grid;
                grid-template-columns: 3fr 1fr;
                grid-template-rows: auto 1fr auto;
                min-height: 100vh;
                padding: 1rem;
                gap: 1rem;
            }

            .header {
                grid-column: 1 / 3;
                padding: 1.5rem;
                border-radius: 0.5rem;
                font-weight: bold;
                background: #1e90ff;

            }

            .footer {
                grid-column: 1 / 3;
                padding: 1.5rem;
                border-radius: 0.5rem;
                font-weight: bold;
                background: #4169e1;

            }

            .main {
                min-height: 20rem;
                padding: 1.5rem;
                border-radius: 0.5rem;
                background: #3cb371;

            }

            .items {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
                margin-top: 1rem;
            }

            .item {
                min-height: 4.5rem;
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 0.5rem;
                background: #2f8d59;
            }

            .sidebar {
                min-height: 20rem;
                padding: 1.5rem;
                border-radius: 0.5rem;
                background: #ff6347;
            }

        </style>
    </head>
    <body>
        <div class="layout">
            <header class="header">header</header>
            <main class="main">
                main
                <div class="items">
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                    <div class="item">item</div>
                </div>
            </main>
            <aside class="sidebar">sidebar</aside>
            <footer class="footer">footer</footer>
        </div>
    </body>
</html>
